
name: Build Eco Safe Harvest APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: run: pnpm install --no-frozen-lockfile --config.ignore-scripts=false

      - name: Install Capacitor
        working-directory: src/frontend
        run: pnpm add @capacitor/core @capacitor/cli @capacitor/android

      - name: Build frontend
        working-directory: src/frontend
        run: pnpm run build

      - name: Create Android project
        working-directory: src/frontend
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android

      - name: Build APK
        working-directory: src/frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eco-safe-harvest-apk
          path: src/frontend/android/app/build/outputs/apk/debug/app-debug.apk
